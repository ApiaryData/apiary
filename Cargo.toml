[workspace]
members = [
    "crates/apiary-core",
    "crates/apiary-floor",
    "crates/apiary-colony",
    "crates/apiary-forage",
    "crates/apiary-entrance",
    "crates/apiary-net",
    "crates/apiary-observe",
    "crates/apiary-comb",
    "crates/apiary-runtime",
    "crates/apiary-plan",
    "crates/apiary-py",
    "crates/apiary-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.2-alpha"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
# Internal crates
apiary-core = { version = "0.1.2-alpha", path = "crates/apiary-core" }
apiary-comb = { version = "0.1.2-alpha", path = "crates/apiary-comb" }
apiary-runtime = { version = "0.1.2-alpha", path = "crates/apiary-runtime" }
apiary-plan = { version = "0.1.2-alpha", path = "crates/apiary-plan" }
apiary-entrance = { version = "0.1.2-alpha", path = "crates/apiary-entrance" }
apiary-net = { version = "0.1.2-alpha", path = "crates/apiary-net" }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Arrow ecosystem
arrow = { version = "59", features = ["prettyprint"] }
parquet = { version = "59", features = ["object_store", "async"] }
datafusion = "55"
datafusion-proto = "55"
deltalake = { version = "1.1", default-features = false, features = ["datafusion", "rustls", "s3"] }
url = "2"
bytes = "1"
futures = "0.3"
object_store = { version = "0.13", features = ["aws"] }

# Entrance
arrow-flight = { version = "59", features = ["flight-sql"] }
tonic = "0.14"
prost = "0.14"
tokio-stream = "0.1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"
rumqttc = "0.25"

# Identity
uuid = { version = "1", features = ["v4"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Python
pyo3 = { version = "0.29", features = ["extension-module"] }
pythonize = "0.29"
