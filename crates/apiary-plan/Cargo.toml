[package]
name = "apiary-plan"
version.workspace = true
edition.workspace = true
description = "DataFusion-based SQL query engine for the Apiary distributed data processing framework"
readme = "README.md"
license.workspace = true

[dependencies]
apiary-core.workspace = true
apiary-comb.workspace = true
arrow.workspace = true
async-trait.workspace = true
bytes.workspace = true
datafusion.workspace = true
datafusion-proto.workspace = true
futures.workspace = true
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic"] }
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[features]
# Run ONNX models through ONNX Runtime, loaded from a shared library when first
# needed (set ORT_DYLIB_PATH), so a build needs no copy of the runtime.
onnx = ["dep:ort"]

[dev-dependencies]
tempfile = "3"
